name: CyberCore Catalog Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run live public catalog adapters
        run: python3 scripts/catalog_sync.py

      - name: Commit catalog snapshot
        run: |
          git config user.name "CyberCore Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/products.json data/catalog-sync-status.json
          git diff --cached --quiet || git commit -m "chore: sync public Iraqi store catalogs"
          git push
